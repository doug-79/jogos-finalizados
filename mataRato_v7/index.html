</script><script id="code" type="text/x-microscript">


function()
init = function()
  // Jogador
  player_x = 0
  player_y = 0
  velocidade = 2
  sprite_atual = "sprite_0" 
  anim_timer = 0
  esta_andando = false
  olhando_para = 1 
  
  // Sistema de Vida
  vidas = 5
  game_over = false
  invencivel_timer = 0 

  // Ataque
  esta_atacando = false
  ataque_timer = 0

  // Sistema de Progressão e Pontos
  pontos = 0
  velocidade_base_rato = 1 

  // Sistema de Cor de Fundo
  cor_fundo = "#000000"

  // INIMIGO: Rato
  rato_x = 0 
  rato_y = 0
  rato_olhando = -1
  rato_sprite = "r_sprite_0"
  rato_timer = 0
  rato_vivo = true
  
  resgatarRato()

  // VARIÁVEIS DE ÁUDIO (HTML5 Seguro para Linux/Chrome)
  musica_tema = nil
  musica_grilos = nil
  audios_iniciados = false
end

update = function()
  if game_over then
    if keyboard.ENTER then
      init() 
    end
    return
  end

  // ATIVAÇÃO GERAL DE ÁUDIO: Libera as músicas no primeiro movimento
  if not audios_iniciados then
    if keyboard.LEFT or keyboard.RIGHT or keyboard.SPACE or touch.touching then
      musica_tema = audio.playMusic("theme")
      musica_grilos = audio.playMusic("crikets")
      audios_iniciados = true
    end
  end

  if invencivel_timer > 0 then
    invencivel_timer = invencivel_timer - 1
  end

  // Lógica do Rato
  if rato_vivo then
    rato_x = rato_x + (velocidade_base_rato * rato_olhando)
    
    rato_timer = rato_timer + 1
    if rato_timer % 20 < 10 then
      rato_sprite = "r_sprite_0"
    else
      rato_sprite = "r_sprite_1"
    end

    // Colisão do rato com o jogador
    if invencivel_timer == 0 and abs(player_x - rato_x) < 15 and abs(player_y - rato_y) < 15 then
      vidas = vidas - 1
      invencivel_timer = 60 
      resgatarRato()        
      
      if vidas <= 0 then
        game_over = true
        // CORREÇÃO DO ERRO DA IMAGEM: Formato correto para parar a música no Micro Studio
        if musica_tema then musica_tema.stop() end
        if musica_grilos then musica_grilos.stop() end
      end
    end

    if rato_x > 200 or rato_x < -200 then
      resgatarRato()
    end
  else
    resgatarRato()
  end

  // Ataque do jogador (Espaço)
  if keyboard.SPACE and not esta_atacando then
    esta_atacando = true
    ataque_timer = 0
    
    // FORMATO SIMPLIFICADO: Melhor compatibilidade com Chrome no Linux Mint
    audio.playSound("punch")
    
    if rato_vivo and abs(player_x - rato_x) < 25 and abs(player_y - rato_y) < 25 then
      rato_vivo = false
      pontos = pontos + 1 
      
      if pontos % 10 == 0 then
        velocidade_base_rato = velocidade_base_rato * 1.2
        mudarCorDeFundo()
      end
    end
  end

  // Animação de ataque
  if esta_atacando then
    ataque_timer = ataque_timer + 1
    if ataque_timer < 10 then
      sprite_atual = "sprite_2"
    elsif ataque_timer < 20 then
      sprite_atual = "sprite_3"
    else
      esta_atacando = false
      sprite_atual = "sprite_0"
    end
  else
    // Movimentação
    esta_andando = false

    if keyboard.LEFT then
      player_x = player_x - velocidade
      esta_andando = true
      olhando_para = -1
    end
    if keyboard.RIGHT then
      player_x = player_x + velocidade
      esta_andando = true
      olhando_para = 1
    end

    // Animação de andar
    if esta_andando then
      anim_timer = anim_timer + 1
      if anim_timer % 20 < 10 then
        sprite_atual = "sprite_0"
      else
        sprite_atual = "sprite_1"
      end
    else
      sprite_atual = "sprite_0"
      anim_timer = 0
    end
  end
end

resgatarRato = function()
  rato_vivo = true
  if random.next() < 0.5 then
    rato_x = -180       
    rato_olhando = 1    
  else
    rato_x = 180        
    rato_olhando = -1   
  end
end

mudarCorDeFundo = function()
  local cores = ["#1a2a3a", "#2c1a3a", "#1a3a2a", "#3a2a1a", "#202020", "#103040", "#401020"]
  local indice = floor(random.next() * cores.length)
  cor_fundo = cores[indice]
end

draw = function()
  screen.fillRect(0, 0, screen.width, screen.height, cor_fundo)
  
  if game_over then
    screen.drawText("GAME OVER", 0, 20, 30, "#FF0000")
    screen.drawText("Acertos totais: " + pontos, 0, -20, 16, "#FFF")
    screen.drawText("Aperte ENTER para reiniciar", 0, -50, 12, "#AAA")
    return
  end

  // DESENHA O RATO
  if rato_vivo then
    screen.setDrawScale(-rato_olhando, 1)
    screen.drawSprite(rato_sprite, rato_x, rato_y, 20, 20)
  end
  
  // DESENHA O JOGADOR
  if invencivel_timer % 8 < 4 then
    screen.setDrawScale(olhando_para, 1)
    screen.drawSprite(sprite_atual, player_x, player_y, 20, 20)
  end
  screen.setDrawScale(1, 1)
  
  // INTERFACE
  screen.drawText("VIDAS: " + vidas, -120, 85, 14, "#FF5555")
  screen.drawText("ACERTOS: " + pontos, 100, 85, 14, "#55FF55")
end

end()
